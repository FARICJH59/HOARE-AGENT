name: HOARE Engineering Tool Provider CI

on:
  push:
    branches:
      - phase-engineering-tool-provider
    paths:
      - 'backend/hoare_engine/engineering_tool_source.py'
      - 'backend/tests/test_engineering_tool_source.py'
      - 'backend/requirements.txt'
      - '.github/workflows/hoare-engineering-tool-provider.yml'
  workflow_dispatch:

jobs:
  engineering-tool-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run engineering tool provider tests
        run: |
          pytest tests/test_engineering_tool_source.py -v
