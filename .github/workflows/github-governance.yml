name: HOARE GitHub Governance Boundary

on:
  push:
    branches:
      - feat/github-governed-repository-broker
  pull_request:
    branches:
      - main
      - feat/github-governed-repository-broker

permissions:
  contents: read

jobs:
  github-governance:
    name: GitHub broker and AEGIS boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Compile GitHub governance modules
        run: |
          python -m py_compile \
            backend/github/__init__.py \
            backend/github/permissions.py \
            backend/github/policy.py \
            backend/github/audit.py \
            backend/github/repository.py \
            backend/github/broker.py \
            backend/github/app.py

      - name: Run GitHub governance tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q \
            backend/tests/test_github_permissions.py \
            backend/tests/test_github_policy.py \
            backend/tests/test_github_audit.py \
            backend/tests/test_github_broker.py
