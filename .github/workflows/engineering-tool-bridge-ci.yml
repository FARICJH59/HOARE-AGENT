name: Engineering Tool Bridge CI

on:
  push:
    branches:
      - main
      - phase-engineering-tool-bridge
  pull_request:
    branches:
      - main
      - phase-engineering-tool-bridge

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run bridge tests
        run: pytest tests/test_engineering_tool_bridge.py -q
