name: Engineering Tool Bridge CI

on:
  push:
    branches:
      - main
      - phase-engineering-agent-llm-bridge
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run engineering tool bridge tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/test_engineering_tools.py -q