name: HOARE Engineering Tool Source CI

on:
  push:
    branches:
      - main
      - phase-engineering-tool-output
    paths:
      - 'backend/hoare_engine/**'
      - 'backend/tests/test_engineering_tool_source.py'
      - 'backend/requirements.txt'
      - '.github/workflows/hoare-engineering-tool-source.yml'
  pull_request:
    paths:
      - 'backend/hoare_engine/**'
      - 'backend/tests/test_engineering_tool_source.py'
      - 'backend/requirements.txt'
      - '.github/workflows/hoare-engineering-tool-source.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run engineering tool source tests
        run: pytest tests/test_engineering_tool_source.py -q