name: HOARE Engineering Tool Agent CI

on:
  push:
    branches:
      - phase-engineering-tool-generation
  pull_request:
    paths:
      - 'backend/hoare_engine/engineering_tool_agent.py'
      - 'backend/tests/test_engineering_tool_agent.py'
      - '.github/workflows/engineering-tool-agent-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run engineering tool tests
        run: pytest tests/test_engineering_tool_agent.py -q
