name: HOARE Engineering Tool Source CI

on:
  push:
    branches:
      - phase-engineering-tool-source
  pull_request:
    branches:
      - main
      - phase-engineering-tool-source

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/test_engineering_tools.py tests/test_engineering_tool_source.py -q
